services:
  - type: web
    name: chat
    env: python
    pythonVersion: 3.11
    buildCommand: |
      pip install --upgrade pip
      pip install --prefer-binary -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: python -m daphne -b 0.0.0.0 -p $PORT chatting.asgi:application